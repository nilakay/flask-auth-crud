<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of {{ choice|capitalize }}</title>
</head>
<body>
    <h1>List of {{ choice|capitalize }}</h1>
    <table border="1">
        <thead>
            <tr>
                {% if choice == 'users' %}
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    
                {% elif choice == 'item' %}
                    <th>ID</th>
                    <th>Name</th>
                    <th>Quanity</th>
                    <th>Price</th>
                {% endif %}
            </tr>
        </thead>
        <tbody>
            {% for element in elements %}
                <tr>
                    {% for value in element %}
                        <td>{{ value }}</td>
                    {% endfor %}
                    <td>
                        <button onclick="updateRecord('{{ element[0] }}', '{{ choice }}')">Update</button>
                        <button onclick="deleteRecord('{{ element[0] }}', '{{ choice }}')">Delete</button>
                    </td>
                </tr>
            {% endfor %}
            
        </tbody>
    </table>
    <button onclick="redirectToMainPage()">Back to Main Page</button>
</body>
<div id="updateFormContainer"></div>
</html>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>

function filterRecords() {
            const data = {
                type: type,
                key: key,
                value: value
            };

            $.ajax({
                url: '/list',
                type: 'GET',
                contentType: 'application/json',
                data: JSON.stringify(data),
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('accessToken')
                },
                success: function(response) {
                    document.getElementById("listTitle").innerText = `List of ${type.charAt(0).toUpperCase() + type.slice(1)}`;
                    displayResults(response, type);
                },
                error: function(error) {
                    console.error('Error applying filter:', error);
                    alert('Error applying list.');
                }
            });
        }


    function deleteRecord(recordId, typee) {
        if (!confirm('Are you sure you want to delete this record?')) return;
        $.ajax({
            url: '/delete',
            type: 'DELETE',
            headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('accessToken')
                },
            contentType: 'application/json',
            data: JSON.stringify({ "typee": typee, "recordId": recordId }),
            success: function(response) {
                alert('Record deleted successfully.');
                window.location.reload(); 
            },
            error: function(error) {
                alert('Error deleting record.');
            }
        });
    }

    function updateRecord(recordId, type) {
    $.ajax({
        url: `/update?id=${recordId}&type=${type}`,
        type: 'GET',
        headers: {
            'Authorization': 'Bearer ' + localStorage.getItem('accessToken')
        },
        success: function(response) {
            $('#updateFormContainer').html(response);
            $('#updateFormContainer').show(); 
            $('#updateFormContainer').attr('data-type', type); 
            $('#updateFormContainer').attr('data-id', recordId);
        },
        error: function(xhr) {
            alert('Error fetching update form: ' + xhr.responseText);
        }
    });
}

    function redirectToMainPage() {
        window.location.href = '/';
    }



</script>
