<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            display: inline-block;
            margin-right: 10px;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        window.onload = function() {
            checkLogin();
        };

        function checkLogin() {
            if (!localStorage.getItem('accessToken')) {
                window.location.href = '/login';
            }
        }

        function logout() {
            localStorage.removeItem('accessToken');
            window.location.href = '/login';
        }
    </script>
</head>
<body>
    <h1>Welcome to the User and Item Management System</h1>
    <nav>
        <ul>
            <li><a href="/add.html">Add Record</a></li>
            <li><a href="/choose_type.html">List Records</a></li>
            <li><a href="/delete.html">Delete Record</a></li>
            <li><a href="/filter.html">Filter Records</a></li>
        </ul>
    </nav>
    <button onclick="logout()">Logout</button>
</body>
</html>
